<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Image Editor - Fictional Characters</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 10px; background: #111; color: #eee; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 1.5em; text-align: center; }
    label, input, textarea, button, select { display: block; width: 100%; margin: 10px 0; padding: 12px; box-sizing: border-box; font-size: 16px; }
    button { background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #666; cursor: not-allowed; }
    button:active:not(:disabled) { background: #45a049; }
    #preview, #result { max-width: 100%; height: auto; border-radius: 8px; margin: 10px 0; display: none; }
    .warning { background: #ff4444; color: white; padding: 10px; border-radius: 8px; font-size: 0.9em; }
    textarea { height: 80px; }
    #status { padding: 10px; margin: 10px 0; border-radius: 8px; background: #222; min-height: 20px; }
    .error { background: #662222; color: #ffaaaa; }
    .success { background: #226622; color: #aaffaa; }
    .loading { background: #222266; color: #aaaaff; }
    a#download { display: none; padding: 12px; background: #2196F3; color: white; text-align: center; border-radius: 8px; text-decoration: none; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fictional Character AI Editor</h1>
    <div class="warning">Fictional adult characters only. No real people. Requires your own running ComfyUI backend (e.g. RunPod with CORS enabled).</div>
    
    <label>ComfyUI API URL (e.g. https://xxxx-8188.proxy.runpod.net):</label>
    <input type="text" id="apiUrl" value="https://your-pod-8188.proxy.runpod.net" placeholder="https://xxxx-8188.proxy.runpod.net">
    <button id="testConn" type="button">Test Connection / CORS</button>
    
    <label>Checkpoint / Model name (must exist on ComfyUI):</label>
    <input type="text" id="modelName" value="sd_xl_base_1.0.safetensors" placeholder="sd_xl_base_1.0.safetensors">
    <button id="listModels" type="button">List Available Models</button>
    
    <label>Upload Character Image:</label>
    <input type="file" id="imageUpload" accept="image/*">
    
    <label>Edit Prompt:</label>
    <textarea id="prompt" placeholder="wearing elegant bikini, glamour lighting, realistic skin, preserve face and identity, high quality">wearing elegant bikini, glamour lighting, realistic skin, preserve face and identity, high quality photorealistic</textarea>
    
    <label>Negative Prompt:</label>
    <textarea id="negPrompt">low quality, deformed, blurry, extra limbs, bad anatomy, ugly, watermark</textarea>
    
    <label>Denoise strength (0.3-0.8 recommended for edits):</label>
    <input type="number" id="denoise" value="0.65" min="0.1" max="1.0" step="0.05">
    
    <label>Steps:</label>
    <input type="number" id="steps" value="20" min="10" max="50">
    
    <button id="generate">Generate / Edit Image</button>
    
    <div id="status"></div>
    
    <h3>Preview / Result</h3>
    <img id="preview">
    <img id="result">
    <a id="download" download="edited.png">Download Result</a>
  </div>
  <script>
    const apiUrlInput = document.getElementById('apiUrl');
    const modelNameInput = document.getElementById('modelName');
    const imageUpload = document.getElementById('imageUpload');
    const promptEl = document.getElementById('prompt');
    const negPromptEl = document.getElementById('negPrompt');
    const denoiseEl = document.getElementById('denoise');
    const stepsEl = document.getElementById('steps');
    const generateBtn = document.getElementById('generate');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const download = document.getElementById('download');
    const statusEl = document.getElementById('status');
    const testConnBtn = document.getElementById('testConn');
    const listModelsBtn = document.getElementById('listModels');

    let uploadedFile = null;
    let lastObjectUrl = null;

    if (localStorage.getItem('comfyApiUrl')) {
      apiUrlInput.value = localStorage.getItem('comfyApiUrl');
    }
    apiUrlInput.addEventListener('change', () => {
      localStorage.setItem('comfyApiUrl', apiUrlInput.value.trim());
    });

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    function getApiUrl() {
      return apiUrlInput.value.trim().replace(/\/$/, '');
    }

    function validateModelName(name) {
      if (!name || !name.trim()) {
        throw new Error('Checkpoint name is empty.');
      }
      const n = name.trim();
      if (!/\.(safetensors|ckpt|pt|pth|bin)$/i.test(n)) {
        throw new Error('Checkpoint name should end with .safetensors, .ckpt, .pt, .pth or .bin');
      }
      return n;
    }

    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        uploadedFile = file;
        const reader = new FileReader();
        reader.onload = (ev) => {
          preview.src = ev.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
        setStatus('Image ready for upload.');
      }
    });

    async function uploadImage(apiUrl, file) {
      const safeName = (file.name || 'input.png').replace(/[^a-zA-Z0-9._-]/g, '_');
      const form = new FormData();
      form.append('image', file, safeName);
      form.append('overwrite', 'true');
      form.append('type', 'input');

      const res = await fetch(`${apiUrl}/upload/image`, {
        method: 'POST',
        body: form
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`Upload failed (${res.status}): ${text}`);
      }
      const data = await res.json();
      if (!data.name) {
        throw new Error('Upload response missing name: ' + JSON.stringify(data));
      }
      return data;
    }

    function buildWorkflow(imageName, prompt, negPrompt, modelName, denoise, steps) {
      const seed = Math.floor(Math.random() * 2147483647);
      const d = parseFloat(denoise);
      const s = parseInt(steps, 10);
      if (isNaN(d) || d < 0.01 || d > 1) throw new Error('Invalid denoise value');
      if (isNaN(s) || s < 1 || s > 150) throw new Error('Invalid steps value');

      return {
        "1": {
          "inputs": { "ckpt_name": modelName },
          "class_type": "CheckpointLoaderSimple"
        },
        "2": {
          "inputs": { "image": imageName, "upload": "image" },
          "class_type": "LoadImage"
        },
        "3": {
          "inputs": { "text": prompt, "clip": ["1", 1] },
          "class_type": "CLIPTextEncode"
        },
        "4": {
          "inputs": { "text": negPrompt, "clip": ["1", 1] },
          "class_type": "CLIPTextEncode"
        },
        "5": {
          "inputs": { "pixels": ["2", 0], "vae": ["1", 2] },
          "class_type": "VAEEncode"
        },
        "6": {
          "inputs": {
            "seed": seed,
            "steps": s,
            "cfg": 7.0,
            "sampler_name": "euler",
            "scheduler": "normal",
            "denoise": d,
            "model": ["1", 0],
            "positive": ["3", 0],
            "negative": ["4", 0],
            "latent_image": ["5", 0]
          },
          "class_type": "KSampler"
        },
        "7": {
          "inputs": { "samples": ["6", 0], "vae": ["1", 2] },
          "class_type": "VAEDecode"
        },
        "8": {
          "inputs": { "filename_prefix": "meme_clipper", "images": ["7", 0] },
          "class_type": "SaveImage"
        }
      };
    }

    async function queuePrompt(apiUrl, workflow) {
      const clientId = 'meme-clipper-' + Date.now();
      const res = await fetch(`${apiUrl}/prompt`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: workflow, client_id: clientId })
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { raw: text }; }
      if (!res.ok) {
        throw new Error(`Queue failed (${res.status}): ${text}`);
      }
      if (data.error || (data.node_errors && Object.keys(data.node_errors).length > 0)) {
        const msg = data.error?.message || JSON.stringify(data.node_errors || data.error);
        throw new Error('Workflow validation failed: ' + msg);
      }
      if (!data.prompt_id) {
        throw new Error('No prompt_id in response: ' + text);
      }
      return data;
    }

    async function pollHistory(apiUrl, promptId, maxAttempts = 120) {
      for (let i = 0; i < maxAttempts; i++) {
        const res = await fetch(`${apiUrl}/history/${promptId}`);
        if (!res.ok) {
          throw new Error(`History check failed (${res.status})`);
        }
        const data = await res.json();
        if (data[promptId]) {
          const entry = data[promptId];
          const status = entry.status || {};
          if (status.status_str === 'error' || status.completed === false) {
            let detail = status.exception_message || status.status_str || 'unknown';
            if (status.messages && Array.isArray(status.messages)) {
              const errMsg = status.messages.find(m => m[0] === 'execution_error' || m[0] === 'execution_interrupted');
              if (errMsg && errMsg[1]) detail = JSON.stringify(errMsg[1]);
            }
            throw new Error('Generation failed on server: ' + detail);
          }
          if (status.completed === true || (entry.outputs && Object.keys(entry.outputs).length > 0)) {
            return entry;
          }
        }
        setStatus(`Generating... (${i + 1}/${maxAttempts})`, 'loading');
        await new Promise(r => setTimeout(r, 2000));
      }
      throw new Error('Timeout waiting for generation (4+ minutes). Check ComfyUI logs.');
    }

    function getViewUrl(apiUrl, imageInfo) {
      const params = new URLSearchParams({
        filename: imageInfo.filename,
        subfolder: imageInfo.subfolder || '',
        type: imageInfo.type || 'output'
      });
      return `${apiUrl}/view?${params.toString()}`;
    }

    async function prepareDownload(viewUrl) {
      try {
        const res = await fetch(viewUrl);
        if (!res.ok) throw new Error('Failed to fetch image for download');
        const blob = await res.blob();
        if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
        lastObjectUrl = URL.createObjectURL(blob);
        download.href = lastObjectUrl;
        download.download = 'edited.png';
        return true;
      } catch (e) {
        download.href = viewUrl;
        download.download = 'edited.png';
        console.warn('Blob download failed, using direct link:', e);
        return false;
      }
    }

    testConnBtn.addEventListener('click', async () => {
      const apiUrl = getApiUrl();
      if (!apiUrl || apiUrl.includes('your-pod')) {
        setStatus('Enter a real ComfyUI proxy URL first.', 'error');
        return;
      }
      setStatus('Testing connection...', 'loading');
      try {
        const res = await fetch(`${apiUrl}/system_stats`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const stats = await res.json();
        setStatus('Connection OK. ComfyUI reachable. ' + (stats.system ? 'System stats received.' : ''), 'success');
      } catch (err) {
        setStatus('Connection failed: ' + err.message + '. Check URL, that the pod is running, and that CORS is enabled (--enable-cors-header "*").', 'error');
      }
    });

    listModelsBtn.addEventListener('click', async () => {
      const apiUrl = getApiUrl();
      if (!apiUrl || apiUrl.includes('your-pod')) {
        setStatus('Enter a real ComfyUI proxy URL first.', 'error');
        return;
      }
      setStatus('Fetching model list...', 'loading');
      try {
        const res = await fetch(`${apiUrl}/models/checkpoints`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const models = await res.json();
        if (!Array.isArray(models) || models.length === 0) {
          setStatus('No checkpoints found. Download models on the pod.', 'error');
          return;
        }
        const list = models.slice(0, 20).join(', ') + (models.length > 20 ? ' ...' : '');
        setStatus(`Available models (${models.length}): ${list}`, 'success');
        const current = modelNameInput.value.trim();
        if (current && !models.includes(current)) {
          setStatus(`Available models (${models.length}): ${list}\n\nWarning: current model "${current}" not in list.`, 'error');
        }
      } catch (err) {
        setStatus('Could not list models: ' + err.message, 'error');
      }
    });

    generateBtn.addEventListener('click', async () => {
      if (!uploadedFile) {
        setStatus('Please upload an image first.', 'error');
        return;
      }
      const apiUrl = getApiUrl();
      if (!apiUrl || apiUrl.includes('your-pod') || apiUrl.includes('127.0.0.1')) {
        setStatus('Please set a valid ComfyUI API URL (your RunPod proxy).', 'error');
        return;
      }
      let modelName;
      try {
        modelName = validateModelName(modelNameInput.value);
      } catch (e) {
        setStatus(e.message, 'error');
        return;
      }
      const prompt = promptEl.value.trim();
      const neg = negPromptEl.value.trim();
      const denoise = denoiseEl.value;
      const steps = stepsEl.value;

      generateBtn.disabled = true;
      result.style.display = 'none';
      download.style.display = 'none';
      setStatus('Uploading image...', 'loading');

      try {
        const uploadInfo = await uploadImage(apiUrl, uploadedFile);
        setStatus(`Uploaded: ${uploadInfo.name}. Queuing prompt...`, 'loading');

        const workflow = buildWorkflow(uploadInfo.name, prompt, neg, modelName, denoise, steps);
        const queueRes = await queuePrompt(apiUrl, workflow);
        const promptId = queueRes.prompt_id;
        setStatus(`Queued (ID: ${promptId}). Waiting for generation...`, 'loading');

        const history = await pollHistory(apiUrl, promptId);
        
        let imageInfo = null;
        for (const nodeId in history.outputs) {
          const out = history.outputs[nodeId];
          if (out.images && out.images.length > 0) {
            imageInfo = out.images[0];
            break;
          }
        }
        if (!imageInfo) {
          throw new Error('No image found in history outputs');
        }

        const viewUrl = getViewUrl(apiUrl, imageInfo);
        result.src = viewUrl;
        result.style.display = 'block';
        await prepareDownload(viewUrl);
        download.style.display = 'block';
        setStatus('Generation complete!', 'success');
      } catch (err) {
        console.error(err);
        setStatus('Error: ' + err.message + ' (Check CORS, model name, and that ComfyUI is running.)', 'error');
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
